<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./calculator.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="calculator">
            <div class="display">
                <input id="input" class="form-control" placeholder="0">
            </div>
            <div class="dial">

                <button class="fun-button" onclick="clearAll()">C</button>
                <button class="digit-button" onclick="displayData('%')">%</button>
                <button class="digit-button" onclick="displayData('÷')">÷</button>
                <button class="fun-button" onclick="removeLastItem()">⌫</button>

                <button class="digit-button" onclick="displayData('7')">7</button>
                <button class="digit-button" onclick="displayData('8')">8</button>
                <button class="digit-button" onclick="displayData('9')">9</button>
                <button class="digit-button" onclick="displayData('×')">×</button>

                <button class="digit-button" onclick="displayData('4')">4</button>
                <button class="digit-button" onclick="displayData('5')">5</button>
                <button class="digit-button" onclick="displayData('6')">6</button>
                <button class="digit-button" onclick="displayData('-')">−</button>

                <button class="digit-button" onclick="displayData('1')">1</button>
                <button class="digit-button" onclick="displayData('2')">2</button>
                <button class="digit-button" onclick="displayData('3')">3</button>

                <button class="digit-button" onclick="displayData('0')">0</button>
                <button class="digit-button" style="font-size: 5px;" onclick="displayData('.')"><i
                        class="fa-solid fa-circle"></i></button>
                <button class="color-btn" onclick="displayOutput()">=</button>

                <button class="color-btn plus" onclick="displayData('+')">+</button>

            </div>
        </div>
    </div>
</body>
<script src="./calculator.js"></script>

</html>
